apiVersion: batch/v1
kind: CronJob
metadata:
  name: infrapilot-scanner-job
spec:
 
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid          
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      
      backoffLimit: 1                
      activeDeadlineSeconds: 600     
      ttlSecondsAfterFinished: 3600  
      template:
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          imagePullSecrets:
          - name: ecr-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
          - name: scanner-job
            # web과 같은 이미지 재사용 — Dockerfile.web이 scripts/도 같이 COPY해서
            # scanner_job.py가 이미 이미지 안에 있음(별도 빌드·별도 ECR 레포 불필요).
            # __IMAGE__ 는 CD가 web과 같은 커밋 SHA 이미지로 치환 → 웹과 스캐너 버전이 항상 일치.
            image: infrapilot-web
            imagePullPolicy: IfNotPresent
            command: ["python", "scripts/scanner_job.py"]
            securityContext:
              allowPrivilegeEscalation: false
            env:
            - name: REDIS_HOST
              value: "redis"
            resources:
              requests:
                memory: "150Mi"
              limits:
                memory: "300Mi"
