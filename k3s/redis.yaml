apiVersion: apps/v1
kind: Deployment          
metadata:
  name: redis
spec:
  replicas: 1              
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--maxmemory", "80mb",
                  "--maxmemory-policy", "allkeys-lru",
                  "--save", "", "--appendonly", "no"]   
        resources:
          requests:
            memory: "50Mi"
          limits:
            memory: "100Mi"   
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service  

metadata:
  name: redis

spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
