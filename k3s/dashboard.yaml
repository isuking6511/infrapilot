---
# DB 접속 정보 (배포 전 직접 생성: kubectl create secret generic db-secret ...)
# kubectl create secret generic db-secret \
#   --from-literal=host=<RDS_ENDPOINT> \
#   --from-literal=name=infrapilot \
#   --from-literal=user=infrapilot \
#   --from-literal=password=<PASSWORD>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrapilot-dashboard
  labels:
    app: infrapilot-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infrapilot-dashboard
  template:
    metadata:
      labels:
        app: infrapilot-dashboard
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: dashboard
          # 배포 전 실제 ECR URI로 교체 필요
          # terraform output ecr_repository_url 로 확인
          image: <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/infrapilot-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: DB_PORT
              value: "5432"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: infrapilot-dashboard
spec:
  type: NodePort
  selector:
    app: infrapilot-dashboard
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
