apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: 
spec:
  ingressClassName: traefik
  rules:
    - host: pickboard.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name:  infrapilot-web
                port:
                  number: 8000