apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrapilot-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infrapilot-web
  template:
    metadata:
      labels:
        app: infrapilot-web
    spec:
      containers:
      - name: web
        # ECR pull은 K3s에서 인증 실패("no basic auth") → tar를 containerd에 직접 import한 로컬 이미지 사용.
        # 왜 IfNotPresent: 이 이름은 레지스트리에 없으므로 pull 시도 금지, 노드에 import된 이미지만 쓰게.
        image: docker.io/library/infrapilot-web:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis"
        # 투표/댓글(RDS) 접속 정보. 시크릿은 이미지에 안 굽고 K8s Secret에서 주입
        # (CLAUDE.md §5.5). db-secret은 `kubectl create secret generic db-secret
        # --from-literal=host=<terraform output db_endpoint> --from-literal=name=infrapilot
        # --from-literal=user=<db_username> --from-literal=password=<db_password>
        # --from-literal=vote-salt=<임의 랜덤 문자열>`로 미리 생성.
        - name: DB_HOST
          valueFrom:
            secretKeyRef: {name: db-secret, key: host}
        - name: DB_NAME
          valueFrom:
            secretKeyRef: {name: db-secret, key: name}
        - name: DB_USER
          valueFrom:
            secretKeyRef: {name: db-secret, key: user}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: db-secret, key: password}
        - name: VOTE_SALT
          valueFrom:
            secretKeyRef: {name: db-secret, key: vote-salt}
        resources:
          requests:
            memory: "150Mi"
          limits:
            memory: "250Mi"
        # self-healing: liveness가 실패하면 kubelet이 컨테이너를 자동 재시작.
        # readiness는 기동 중(모델/템플릿 로딩)엔 트래픽을 안 받다가 준비되면 받게.
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: infrapilot-web
spec:
  # 기본값 ClusterIP였던 걸 NodePort로 변경 — 이거 없으면 클러스터 밖에서 접속 불가.
  # 30080은 이미 SG(modules/security)에서 0.0.0.0/0으로 열어둔 포트(예전 dashboard.yaml과
  # 동일 포트 재사용) — Terraform 변경 없이 바로 접속 가능.
  type: NodePort
  selector:
    app:  infrapilot-web
  ports:
  - port:  8000
    targetPort:  8000
    nodePort: 30080