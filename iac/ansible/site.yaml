---
- name: infra pilot
  hosts: k3s-server
  become: true
  tasks:
    - name: install essential packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - htop
          - net-tools
          - jq
          - python3-pip
        state: present
        update_cache: true


    - name: install k3s
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
    - name: wait for k3s to be ready
      ansible.builtin.command: k3s kubectl get nodes -o json
      register: k3s_nodes
      changed_when: false
    
    - name: node output
      ansible.builtin.debug:
        msg: "{{k3s_nodes.stdout_lines}}"