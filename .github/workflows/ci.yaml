name: CI
run-name: CI on ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check infrapilot/analysis_core infrapilot/dashboard infrapilot/db scripts tests

      - name: Test
        run: pytest -q


  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.4'

      - name: Format Check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false #s3 연결 x

      - name: Terraform validate
        run: terraform validate

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install 'ansible-core==2.20.4'

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yaml

      - name: Syntax check
        run: ansible-playbook site.yaml --syntax-check

  #k3s-manifests
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate
        run: kubeconform -strict -summary k3s/*.yaml k3s/monitoring/*.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: docker build -f Dockerfile.web .
  aws-auth:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, terraform, ansible, manifests, docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write         
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}   
          aws-region: ap-northeast-2

      - name: Who am I
        run: aws sts get-caller-identity               