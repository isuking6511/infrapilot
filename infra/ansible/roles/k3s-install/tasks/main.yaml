---
# Traefik(Ingress) 비활성화: 웹은 NodePort(30080)로만 서비스해서 Ingress가 필요 없고,
# 1GB 노드에서 Traefik이 OOM으로 죽었던 적도 있다 → 안 쓰는 컴포넌트는 끄고 메모리를 앱에 준다.
# config.yaml은 설치 전/후 모두 적용됨(이미 설치된 노드는 k3s 재시작 시 Traefik이 제거됨).
# 나중에 Ingress가 필요해지면 이 값을 false로 바꾸고 다시 실행.
- name: k3s config dir
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: k3s config (disable unused components)
  ansible.builtin.copy:
    content: |
      # managed by ansible (k3s-install role)
      write-kubeconfig-mode: "0600"
      {% if k3s_disable_traefik | default(true) %}
      disable:
        - traefik
      {% endif %}
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: restart k3s

- name: install k3s
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s to start
  ansible.builtin.pause:
    seconds: 30

- name: wait for k3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  changed_when: false

- name: node output
  ansible.builtin.debug:
    msg: "{{ k3s_nodes.stdout_lines }}"

# ubuntu 유저가 sudo 없이 kubectl 쓰게 — 루트 kubeconfig(600 유지)를 홈에 복사본으로.
# (become:true라 root가 k3s.yaml을 읽어 /home/ubuntu에 쓸 수 있음)
- name: ensure ~/.kube dir for ubuntu
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: copy k3s kubeconfig to ubuntu home
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: set KUBECONFIG for ubuntu login shells
  ansible.builtin.lineinfile:
    path: /home/ubuntu/.bashrc
    line: 'export KUBECONFIG=$HOME/.kube/config'
    state: present