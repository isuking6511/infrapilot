---

## Task 변경 되면 chrony 재시작 필요
- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

## sshd 설정(PasswordAuthentication/PermitRootLogin) 변경 시 재시작 (Ubuntu 서비스명=ssh)
- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

## fail2ban jail 변경 시 재시작
- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

