[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "infrapilot"
version = "0.1.0"
description = "AI Multi-Agent Trading & Self-Healing Infrastructure"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
    "kubernetes>=29.0",
    "ccxt>=4.0",
    "pandas>=2.0",
    "ta>=0.11",
    "jinja2>=3.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    # anthropic, openai 제거 (optional로만)
]

[project.optional-dependencies]
claude = ["anthropic>=0.25"]
openai = ["openai>=1.30"]
gemini = ["google-generativeai>=0.5"]
ollama = []
all = ["anthropic>=0.25", "openai>=1.30", "google-generativeai>=0.5"]
dev = ["ruff>=0.4", "mypy>=1.10", "pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
infrapilot = "infrapilot.cli.main:cli"
[tool.hatch.build.targets.wheel]
packages = ["src/infrapilot"]