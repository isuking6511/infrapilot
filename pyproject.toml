[project]
name = "infrapilot"
version = "0.1.0"
description = "AI Multi-Agent Trading & Self-Healing Infrastructure"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
    "kubernetes>=29.0",
    "anthropic>=0.25",      # optional
    "openai>=1.30",         # optional
    "ccxt>=4.0",            # 거래소 통합
    "pandas>=2.0",          # 지표 계산
    "ta>=0.11",             # 기술 지표 라이브러리
    "jinja2>=3.0",          # 프롬프트 템플릿
    "rich>=13.0",           # CLI 출력 꾸미기
]

[project.optional-dependencies]
claude = ["anthropic>=0.25"]
openai = ["openai>=1.30"]
gemini = ["google-generativeai>=0.5"]
ollama = []  
all = ["anthropic", "openai", "google-generativeai"]

[project.scripts]
infrapilot = "infrapilot.cli.main:cli"