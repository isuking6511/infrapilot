controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests: { memory: 64Mi }
    limits:   { memory: 256Mi }   # 앱·ArgoCD와 같은 노드라 상한 필수
  configMap:
    content: |
      
      prometheus.remote_write "monitoring" {
        endpoint { url = "http://10.0.1.11:8428/api/v1/write" }
        external_labels = { cluster = "infrapilot" }
      }

      loki.write "monitoring" {
        endpoint { url = "http://10.0.1.11:3100/loki/api/v1/push" }
        external_labels = { cluster = "infrapilot" }
      }


      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "$1:10250"
        }
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
      }
      prometheus.scrape "cadvisor" {
        targets           = discovery.relabel.cadvisor.output
        scheme            = "https"
        scrape_interval   = "60s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true   
        }
        forward_to = [prometheus.relabel.keep_needed.receiver]
      }


      prometheus.relabel "keep_needed" {
        rule {
          source_labels = ["__name__"]
          regex         = "container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_spec_memory_limit_bytes|container_oom_events_total|machine_memory_bytes|machine_cpu_cores"
          action        = "keep"
        }
        forward_to = [prometheus.remote_write.monitoring.receiver]
      }


      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.monitoring.receiver]
      }